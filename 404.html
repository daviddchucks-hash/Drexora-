<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <title>404 – Page Not Found | Drexora</title>
  <link rel="icon" type="image/png" href="assets/images/logo.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" crossorigin="anonymous" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --primary: #8b21e6;
      --primary-light: #a855f7;
      --accent: #c026d3;
      --bg: #ffffff;
      --bg-alt: #f8f5ff;
      --text: #1a0a2e;
      --text-muted: #6b6490;
      --border: rgba(107,33,168,0.15);
    }
    body {
      font-family: 'Inter', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 2rem;
    }
    .logo-wrap { margin-bottom: 1.5rem; }
    .logo-wrap img {
      width: 64px; height: 64px;
      object-fit: contain;
    }
    .error-code {
      font-family: 'Space Grotesk', sans-serif;
      font-size: clamp(5rem, 15vw, 9rem);
      font-weight: 800;
      line-height: 1;
      background: linear-gradient(135deg, #8b21e6, #c026d3, #0891b2);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: 'Space Grotesk', sans-serif;
      font-size: clamp(1.4rem, 4vw, 2rem);
      font-weight: 700;
      margin-bottom: 0.75rem;
    }
    p {
      color: var(--text-muted);
      font-size: 1rem;
      max-width: 480px;
      line-height: 1.7;
      margin-bottom: 2rem;
    }
    .btn-group { display: flex; flex-wrap: wrap; gap: 0.75rem; justify-content: center; }
    .btn {
      display: inline-flex; align-items: center; gap: 0.5rem;
      padding: 0.75rem 1.5rem;
      border-radius: 8px;
      font-size: 0.9rem;
      font-weight: 600;
      text-decoration: none;
      transition: all 0.25s;
    }
    .btn-primary {
      background: linear-gradient(135deg, #8b21e6, #c026d3);
      color: #fff;
    }
    .btn-primary:hover { transform: translateY(-2px); }
    .btn-outline {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text);
    }
    .btn-outline:hover { border-color: var(--primary-light); color: var(--primary-light); }
    .footer-note {
      position: absolute;
      bottom: 1.5rem;
      font-size: 0.8rem;
      color: var(--text-muted);
    }
    .footer-note a { color: var(--primary-light); text-decoration: none; }
    .footer-note a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <div class="logo-wrap">
    <a href="index.html" aria-label="Drexora home">
      <img src="assets/images/logo.png" alt="Drexora Logo" />
    </a>
  </div>
  <div class="error-code" aria-label="Error 404">404</div>
  <h1>Page Not Found</h1>
  <p>The page you're looking for doesn't exist or has been moved. Return to our homepage or explore our products on Drexora Hub.</p>
  <div class="btn-group">
    <a href="index.html" class="btn btn-primary">
      <i class="fas fa-home"></i> Back to Home
    </a>
    <a href="https://drexorahub.drexxora.name.ng" target="_blank" rel="noopener" class="btn btn-outline">
      <i class="fas fa-layer-group"></i> Visit Drexora Hub
    </a>
  </div>
  <p class="footer-note">
     &copy; <span id="yr"></span> <a href="index.html">Drexora</a> — Digital experiences that move brands forward
  </p>
  <script>document.getElementById('yr').textContent = new Date().getFullYear();</script>
</body>
</html>
